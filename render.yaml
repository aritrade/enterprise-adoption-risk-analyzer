services:
  - type: web
    name: adoption-risk-analyzer-demo
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: SYNC_ENABLED
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.6"
