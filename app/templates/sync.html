<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Observability &mdash; Adoption & Escalation Risk Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v={{ cache_bust }}">
    <style>
        .sync-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .sync-card { padding: 16px; border-radius: 8px; background: var(--bg-card, #1a1f2e); border: 1px solid var(--border, #2a2f3e); }
        .sync-card h3 { margin: 0 0 8px 0; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.04em; }
        .sync-card .age { font-size: 1.6rem; font-weight: 700; }
        .sync-card .age.fresh { color: var(--risk-low, #22c55e); }
        .sync-card .age.aging { color: var(--risk-medium, #f59e0b); }
        .sync-card .age.stale { color: var(--risk-high, #ef4444); }
        .sync-card .meta { font-size: 0.78rem; color: var(--text-muted, #94a3b8); margin-top: 4px; }
        .sync-card button { margin-top: 10px; }
        table.runs { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        table.runs th, table.runs td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border, #2a2f3e); }
        table.runs th { font-weight: 600; color: var(--text-muted); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em; }
        .status-pill { padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
        .status-pill.ok { background: rgba(34,197,94,0.15); color: #22c55e; }
        .status-pill.partial { background: rgba(245,158,11,0.18); color: #f59e0b; }
        .status-pill.failed { background: rgba(239,68,68,0.18); color: #ef4444; }
        .status-pill.running { background: rgba(99,102,241,0.18); color: #818cf8; }
        .ai-cell { font-size: 0.75rem; color: var(--text-muted); }
        .ai-cell .badge { background: rgba(168,85,247,0.18); color: #c084fc; padding: 1px 6px; border-radius: 6px; margin-right: 4px; }
    </style>
</head>
<body>
<div class="app-container" style="padding: 24px;">
    <header>
        <div>
            <h1>Sync Observability</h1>
            <p class="subtitle">Background ingestion runs &middot; freshness &middot; AI heal actions</p>
        </div>
        <div class="header-actions">
            <a href="/" class="btn btn-secondary">&larr; Dashboard</a>
            <button class="btn btn-secondary" onclick="loadAll()">&#x21bb; Refresh</button>
        </div>
    </header>

    <h2 style="margin-top: 24px;">Per-source Freshness</h2>
    <div id="freshness-grid" class="sync-grid">Loading&hellip;</div>

    <h2 style="margin-top: 24px;">Recent Runs (last 50)</h2>
    <div style="overflow-x: auto;">
        <table class="runs">
            <thead>
                <tr>
                    <th>Started</th><th>Source</th><th>Kind</th>
                    <th>Status</th><th>Accounts</th>
                    <th>Duration</th><th>AI Actions</th><th>Notes</th>
                </tr>
            </thead>
            <tbody id="runs-body">
                <tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-muted);">Loading&hellip;</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
const SOURCES = ["salesforce", "portal_globals", "insights", "csinsights", "glean"];

function ageClass(minutes) {
    if (minutes == null || minutes < 0) return "stale";
    if (minutes < 150) return "fresh";
    if (minutes < 300) return "aging";
    return "stale";
}

function fmtAge(minutes) {
    if (minutes == null || minutes < 0) return "never";
    if (minutes < 60) return minutes + "m ago";
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    if (h < 24) return `${h}h ${m}m ago`;
    const d = Math.floor(h / 24);
    return `${d}d ${h % 24}h ago`;
}

function minutesSince(iso) {
    if (!iso) return -1;
    const then = new Date(iso);
    if (isNaN(then)) return -1;
    return Math.max(0, Math.floor((Date.now() - then.getTime()) / 60000));
}

function fmtDuration(startIso, endIso) {
    if (!startIso || !endIso) return "—";
    const ms = new Date(endIso).getTime() - new Date(startIso).getTime();
    if (isNaN(ms) || ms < 0) return "—";
    if (ms < 1000) return `${ms}ms`;
    if (ms < 60000) return `${Math.round(ms / 100) / 10}s`;
    const m = Math.floor(ms / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    return `${m}m ${s}s`;
}

async function loadFreshness() {
    const grid = document.getElementById("freshness-grid");
    try {
        const data = await fetch("/api/sync/freshness").then(r => r.json());
        const cards = SOURCES.map(src => {
            const latest = (data.latest_runs || {})[src];
            const snap = (data.snapshot_freshness || {})[src];
            const last = latest ? latest.started_at : snap;
            const mins = minutesSince(last);
            const cls = ageClass(mins);
            return `
                <div class="sync-card">
                    <h3>${src}</h3>
                    <div class="age ${cls}">${fmtAge(mins)}</div>
                    <div class="meta">${latest ? `status: <strong>${latest.status}</strong> · ${latest.accounts_processed ?? 0} accts` : "no successful run yet"}</div>
                    <button class="btn btn-secondary" onclick="triggerSync('${src}')">Resync now</button>
                </div>`;
        }).join("");
        grid.innerHTML = cards;
    } catch (e) {
        grid.innerHTML = `<div class="sync-card">Failed to load: ${e}</div>`;
    }
}

async function loadRuns() {
    const tbody = document.getElementById("runs-body");
    try {
        const runs = await fetch("/api/sync/runs?limit=50").then(r => r.json());
        if (!runs.length) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-muted);">No sync runs yet — they appear after the first scheduled cron tick.</td></tr>`;
            return;
        }
        tbody.innerHTML = runs.map(r => {
            const ai = r.ai_actions || [];
            const aiCell = ai.length === 0 ? "—" : ai.map(a =>
                `<span class="badge" title="${a.human_summary || ''}">${a.verdict}${a.ai_disabled ? ' (off)' : ''}</span>`
            ).join("");
            return `
                <tr>
                    <td>${(r.started_at || "").replace("T", " ").slice(0, 19)}</td>
                    <td><strong>${r.source}</strong></td>
                    <td>${r.kind}</td>
                    <td><span class="status-pill ${r.status}">${r.status}</span></td>
                    <td>${r.accounts_processed ?? 0}</td>
                    <td>${fmtDuration(r.started_at, r.finished_at)}</td>
                    <td class="ai-cell">${aiCell}</td>
                    <td>${r.notes || ""}</td>
                </tr>`;
        }).join("");
    } catch (e) {
        tbody.innerHTML = `<tr><td colspan="8">Failed to load: ${e}</td></tr>`;
    }
}

async function triggerSync(source) {
    try {
        const res = await fetch(`/api/sync/run/${source}`, { method: "POST" });
        const data = await res.json();
        alert(`Queued ${source} sync${data.queued ? '' : ' (failed)'}. Watch the runs table for results.`);
        setTimeout(loadAll, 2000);
    } catch (e) {
        alert(`Trigger failed: ${e}`);
    }
}

function loadAll() {
    loadFreshness();
    loadRuns();
}

loadAll();
setInterval(loadAll, 30000);
</script>
</body>
</html>
