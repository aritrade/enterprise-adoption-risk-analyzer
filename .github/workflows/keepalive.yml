name: Keep demo warm

# Render's free tier spins the instance down after ~15 min of inactivity, which
# adds a 30-60s cold start to the next visit. This pings the health endpoint on
# a schedule so a recruiter following the portfolio link hits a warm instance.
# Public repos get unlimited free Actions minutes, so this costs nothing.
#
# Note: this is a best-effort backup — GitHub's scheduled runs can be delayed
# under load. For guaranteed warmth, also add an UptimeRobot 5-min monitor.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:          # allow manual runs from the Actions tab

# Don't pile up overlapping runs if one is slow waking the instance.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="https://enterprise-adoption-risk-analyzer.onrender.com/api/health"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Demo is warm."
              exit 0
            fi
            sleep 20
          done
          echo "Health check never returned 200 (instance may be waking)."
          exit 1
